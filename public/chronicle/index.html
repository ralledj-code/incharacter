__cw.boards["00-story-so-far"] = {"id":"story-so-far","live":true,"cover":"s01","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","drow":"a beautiful drow woman: dark purple-grey skin, long straight white hair, pointed ears, violet eyes, a fitted dark leather outfit with silver details, a sly smile","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel he __cw.boards["01-first-steps"] = {"id":"first-steps","live":true,"cover":"s02","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","silas":"Silas, a lean human dock smuggler in his thirties: buzzed dark hair, stubble, sunken nervous eyes, drab grey-olive patched coat, rope belt, ink-stained fingers","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","guildmen":"two different burly trade-guild enforcers, clearly two distinct men: one bald and heavy-set with a short red beard, one taller with greasy black hair and a scar across the cheek; both in bright crimson red wool coats with brass guild badges, red angry faces, cudgels at their belts"},"shots":[{"id":"s01","t":0,"in":"black","who":["lucien"],"fx":["embers","smoke"],"flicker":0.6,"move":{"from":[0,0.06,0],"to":[0,0.05,0.12]},"focus":[0.5,0.5],"scene":"Extreme close shot of a dying campfire at night in a pine forest, a few glowing logs and embers, behind it the warm-lit face and hands of Lucien Vale tuning his lute, eyes down, darkness all around"},{"id":"s02","t":8.2,"in":"fade","who":["lucien"],"fx":["embers"],"flicker":0.5,"move":{"from":[-0.04,0,0.05],"to":[0.03,0,0.12]},"focus":[0.45,0.4],"scene":"Medium close-up of Lucien Vale by a low campfire, looking up from his lute straight at the viewer as if about to tell a story, firelight on one side of his face, cold blue night on the other"},{"id":"s03","t":12.5,"in":"ink","who":[],"fx":["dust"],"move":{"from":[0,0,0],"to":[0.02,-0.02,0.2]},"focus":[0.5,0.55],"scene":"Still life on a rough tavern table lit by one candle: two bone dice, a small cloth pouch of dark herbs and a glass vial, a few copper coins, deep shadows, painterly","flicker":0.45},{"id":"s04","t":16.8,"in":"ink","who":[],"fx":["fog"],"move":{"from":[0 __cw.boards["02-finding-silas"] = {"id":"finding-silas","live":true,"cover":"s21","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","mara":"Mara, Lucien's only real friend: a strong, curvy, attractive barkeep in her thirties, broad shoulders and strong arms, thick auburn hair tied back, freckles, warm confident eyes, rolled-up linen sleeves, a leather apron and laced bodice, a tavern woman who can throw a drunk out by herself","mother":"the brothers' mother: a tall, noble, beautiful lady in her fifties, graceful and upright, long silver-streaked dark hair braided with gold, fine high-cheekboned face, deep green travelling gown and a fur-lined grey cloak, a dignified bearing, warm but sorrowful eyes","assassin":"a Scarlet assassin: a lean woman in close-fitting dark red leather with a hood and a half mask over her mouth, cold pale eyes, short black hair, a recurve bow and a quiver, knives at her belt","guard":"guards of the Ahm Dynasty, the merchant house: men in black and gold livery with gold-trimmed half-capes, steel breastplates, short swords and crossbows, a golden crest of a winged lion on the chest","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","silas":"Silas, a lean human dock smuggler in his thirties: buzzed dark hair, stubble, sunken nervous eyes, drab grey-olive patched coat, rope belt, ink-stained fingers","wolfsilas":"Silas the werewolf, exactly as in the reference painting: the lean dock smuggler turned, a full wolf snout and fangs, coarse dark brown fur, wild glowing yellow eyes, clawed hands, his drab grey-olive patched coat torn to rags; frightening, not comical","wife":"Silas's wife, half-turned werewolf: a thin poor dockside woman in her thirties in a ragged grey dress and shawl, dark tangled hair, her face stretching toward a wolf snout with fangs, coarse fur on her arms and neck, clawed hands, glowing yellow eyes, wild and frightening","kids":"Silas's two small children, a boy and a girl about seven and nine, thin and poor in patched clothes, dark hair, ordinary human children with normal brown eyes, no fangs, no fur, frightened"},"shots":[{"id":"s01","t":0,"in":"black","who":["severin"],"fx":["fog"],"grade":"green","move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"A misty dark pine forest at night, far away between the trees a tall pale woman with silver-white hair, only a silhouette and two faint green eyes"},{"id":"s02","t":6.5,"in":"fade","who":[],"fx":["fog"],"grade":"cold","move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"A thin moon over a sleeping harbour town, fog on the roofs, no people"},{"id":"s03","t":12.5,"in":"fade","who":["silas"],"fx":["fog"],"grade":"green","move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"Silas the lean dock smuggler in his patched grey-olive coat in a poor town street by day, handing out small glass potion vials for free to sick, coughing townsfolk wrapped in blankets, a sickly green glow in the vials"},{"id":"s04","t":16.78,"in":"cut","who":["silas"],"fx":["fog"],"grade":"green","move":{"from":[0.05,0.02,0.02],"to":[-0.04,0,0.12]},"scene":"Close-up of Silas's ink-stained hand placing a glowing green vial into a sick old woman's shaking hands, his tired, kind face behind"},{"id":"s05","t":22.4,"in":"cut","who":[],"fx":["dust"],"move":{"from":[0,0.04,0.02],"to":[0,0,0.18]},"scene":"Inside a crowded sickhouse, sick townsfolk on cots drinking from small glass vials, candlelight, relief on their faces"},{"id":"s06","t":26.82,"in":"cut","who":[],"fx":["fog"],"grade":"cold","move":{"from":[0.03,0,0.08],"to":[-0.03,0,0.16]},"scene":"Close-up of a sick man's hand on a blanket, coarse dark fur starting to sprout at his wrist, his nails lengthening into claws"},{"id":"s07","t":32.2,"in":"fade","who":[],"fx":["fog" __cw.boards["03-first-moonwell"] = {"id":"first-moonwell","live":true,"cover":"s17","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","mara":"Mara, Lucien's only real friend: a strong, curvy, attractive barkeep in her thirties, broad shoulders and strong arms, thick auburn hair tied back, freckles, warm confident eyes, rolled-up linen sleeves, a leather apron and laced bodice, a tavern woman who can throw a drunk out by herself","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","wolfsilas":"Silas the werewolf, exactly as in the reference painting: the lean dock smuggler turned, a full wolf snout and fangs, coarse dark brown fur, wild glowing yellow eyes, clawed hands, his drab grey-olive patched coat torn to rags; frightening, not comical","kids":"Silas's two small children, a boy and a girl about seven and nine, thin and poor in patched clothes, dark hair, ordinary human children with normal brown eyes, no fangs, no fur, frightened","guard":"guards of the Ahm Dynasty, the merchant house: men in black and gold livery with gold-trimmed half-capes, steel breastplates, short swords and crossbows, a golden crest of a winged lion on the chest","moonwell":"the first moonwell site, laid out as in the reference photo of the tabletop model","aldraik":"Aldraik, the Ahm Dynasty's merchant master: a short, very fat human man, barely chest-high to the brothers, round belly straining a gaudy gold-embroidered black waistcoat, a big bald head, a huge bushy moustache and mutton chops, a gold tooth in a wide greedy grin, small shrewd scheming eyes, fat fingers covered in jeweled rings, a gold monocle on a chain, a fur-trimmed coat with the golden winged lion crest, a cigar; a loud, cocky, scheming boss of a villain","carius":"Carius, a man from the small village of Lehai: a farmer in his forties, plain brown tunic, muddy, terrified, half of him fused into the black goo monster","aberration":"a huge monstrous aberration born of black goo, as big as a house, towering three times taller than a man: a heaving, dripping mass of black slime and tar with long thick grasping tendrils, a ring of many pale clouded eyes and a vast toothed maw; fused into its underside is Carius, a village man in a plain brown tunic, merged into the black mass up to his chest, unarmed, his anguished face and arms sticking out, tiny against the monster. Painted grim, dark and realistic like a horror creature, wet and heavy, not cartoony","cube":"a gelatinous cube: a huge transparent, faintly green block of jelly in the exact shape of a perfect cube with flat sides and straight edges, taller than a man, almost invisible, bones and coins floating inside it, never shaped like a person or creature"},"shots":[{"id":"s01","t":0,"in":"black","who":[],"fx":["fog"],"flicker":0.3,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"Mara's tavern on a wet cobbled street at night, a warm window, no people"},{"id":"s02","t":7,"in":"fade","who":[],"fx":["fog"],"flicker":0.3,"move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"Close-up of a small glass vial of glowing silver moonwell water standing on a scarred tavern table, candlelight"},{"id":"s03","t":13.89,"in":"cut","who":["lucien","arthas","cedric"],"fx":["dust"],"flicker":0.4,"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"in Mara's tavern at night, warm firelight, the three brothers around a table arguing over the small silver vial between them, Lucien Vale (long blond hair, pointed ears, burgundy coat) Arthas with his hood up, Cedric"},{"id":"s04","t":20.9,"in":"cut","who":["mara"],"fx":["dust"],"flicker":0.3,"move":{"from":[0.05,0.02,0.02],"to":[-0.04,0,0.12]},"scene":"in Mara's tavern at night, warm firelight, Mara standing in a doorway behind the bar, arms folded, wor __cw.boards["04-cleansing-well"] = {"id":"cleansing-well","live":true,"cover":"s18","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","cube":"a gelatinous cube: a huge transparent, faintly green block of jelly in the exact shape of a perfect cube with flat sides and straight edges, taller than a man, almost invisible, bones and coins floating inside it, never shaped like a person or creature","moonwell":"the first moonwell site, laid out as in the reference photo of the tabletop model","carius":"Carius, a man from the small village of Lehai: a farmer in his forties, plain brown tunic, muddy, terrified, rescued","pig":"the Pig, a hulking humanoid butcher about three metres tall with the head of a pig: heavy jowls, short tusks, small cruel eyes, reddish-pink skin, a leather butcher's apron soaked in blood, thick arms, a huge broadaxe, covered head to toe in blood","baphomet":"Baphomet, a goat-headed demon imprisoned deep beneath a moonlit lake, only ever seen as an enormous face beneath its black water, never rising out of it: long curved black horns, matted dark fur, cracked skin glowing like embers, burning yellow eyes","neris":"Neris, a wiry forest druid in his forties who carries a wolf curse: moss-green hooded ranger cloak over worn leather, a gnarled wooden staff, gaunt weathered face, unkempt dark hair and short beard, amber eyes, a haunted desperate look","kalen":"Kalen, a Church paladin the brothers know: a broad young man in his twenties, short brown hair, a square jaw, dented white-and-steel Church plate with a gold sun emblem, torn white tabard, bloodied and bruised, wrists chained","wolves":"werewolves: hulking grey and brown wolf-men with snouts, fangs, __cw.boards["05-hunt-pig"] = {"id":"hunt-pig","live":true,"cover":"s21","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","pig":"the Pig, a hulking humanoid butcher about three metres tall with the head of a pig: heavy jowls, short tusks, small cruel eyes, reddish-pink skin, a leather butcher's apron soaked in blood, thick arms, a huge broadaxe, covered head to toe in blood","moonwell":"the first moonwell site, laid out as in the reference photo of the tabletop model","carius":"Carius, a man from the small village of Lehai: a farmer in his forties, plain brown tunic, muddy, terrified, rescued","poles":"the circle of twelve poles in the town square, as in the reference painting","wolves":"werewolves: hulking grey and brown wolf-men with snouts, fangs, glowing yellow eyes, ragged fur and torn clothes, carrying burning torches","troll":"a blood troll: a hulking, hunched cave troll twice a man's height, dark red blood-slick skin, long arms with claws, a jutting jaw with tusks, small burning eyes, ragged hair","werebear":"werebears that control their shape: big bearded men in fur-trimmed leather, and the same men as huge brown bears, or half man half bear, calm and proud"},"shots":[{"id":"s01","t":0,"in":"black","who":["lucien"],"fx":["fog"],"grade":"cold","move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"in the square of a small poor village at dusk, thatched houses, night, seen from behind: Lucien Vale (long blond hair, pointed ears, burgundy coat) crouched on the edge of a thatched rooftop, rose petals in the wind, the square far below"},{"id":"s02","t":9,"in":"fade","who":[],"fx":["fog","embers"],"grade":"red","flicker":0.4,"move":{"from":[-0.04,0,0.05],"to":[0.04,0 __cw.boards["06-slaying-pig"] = {"id":"slaying-pig","live":true,"cover":"s03","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","baphomet":"Baphomet, a goat-headed demon imprisoned deep beneath a moonlit lake, only ever seen as an enormous face beneath its black water, never rising out of it: long curved black horns, matted dark fur, cracked skin glowing like embers, burning yellow eyes","pig":"the Pig, a hulking humanoid butcher about three metres tall with the head of a pig: heavy jowls, short tusks, small cruel eyes, reddish-pink skin, a leather butcher's apron soaked in blood, thick arms, a huge broadaxe","valerys":"High Inquisitor Valerys, the stern father of Arthas and Cedric: a tall man in his sixties, close-cropped grey hair and a short grey beard, hard pale grey eyes, white and crimson inquisitor robes with a gold sun emblem on the chest, a heavy gold chain of office, a calm unreadable face","prisoner":"the last prisoner, a gaunt townsman of Stagford in his thirties: torn grey rags, dark stubble, hollow cheeks, shackled wrists, dirty and exhausted"},"shots":[{"id":"s01","t":0,"in":"black","who":[],"fx":["smoke","embers"],"flicker":0.4,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"Establishing shot of the Pig's slaughterhouse deep inside a mountain: vast cut-stone halls, meat hooks and chains, braziers, a massive pool of blood glowing dark red in the middle of the great hall, smoke hanging in the air"},{"id":"s02","t":10.35,"in":"fade","who":["pig"],"fx":["smoke","embers"],"flicker":0.5,"move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"The Pig at the edge of the blood pool: a hulking humanoid butcher with a pig's head, a blood-soaked leather ap -Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","neris":"Neris, a wiry forest druid in his forties who carries a wolf curse: moss-green hooded ranger cloak over worn leather, a gnarled wooden staff, gaunt weathered face, unkempt dark hair and short beard, amber eyes, a haunted desperate look","valerys":"High Inquisitor Valerys, the stern father of Arthas and Cedric: a tall man in his sixties, close-cropped grey hair and a short grey beard, hard pale grey eyes, white and crimson inquisitor robes with a gold sun emblem on the chest, a heavy gold chain of office, a calm unreadable face","mara":"Mara, Lucien's only real friend: a strong, curvy, attractive barkeep in her thirties, broad shoulders and strong arms, thick auburn hair tied back, freckles, warm confident eyes, rolled-up linen sleeves, a leather apron and laced bodice, a tavern woman who can throw a drunk out by herself","aldraik":"Aldraik, the Ahm Dynasty's merchant master: a short, very fat human man, barely chest-high to the brothers, round belly straining a gaudy gold-embroidered black waistcoat, a big bald head, a huge bushy moustache and mutton chops, a gold tooth in a wide greedy grin, small shrewd scheming eyes, fat fingers covered in jeweled rings, a gold monocle on a chain, a fur-trimmed coat with the golden winged lion crest, a cigar; a loud, cocky, scheming boss of a villain","guard":"guards of the Ahm Dynasty, the merchant house: men in black and gold livery with gold-trimmed half-capes, steel breastplates, short swords and crossbows, a golden crest of a winged lion on the chest","lake":"the moon lake of Cobh, as in the reference painting","mayor":"the mayor of Cobh: an older lady in her late sixties, small and upright, deeply lined stern face, thin pressed lips, sharp pale eyes, silver-white hair in a severe tight bun, a hi __cw.boards["08-baphomet"] = {"id":"baphomet","live":true,"cover":"s21","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","neeris":"Neeris, a wiry forest druid in his forties who carries a wolf curse: moss-green hooded ranger cloak over worn leather, a gnarled wooden staff, gaunt weathered face, unkempt dark hair and short beard, amber eyes, a haunted desperate look","baphomet":"Baphomet, a goat-headed demon imprisoned deep beneath a moonlit lake, only ever seen as an enormous face beneath its black water, never rising out of it: long curved black horns, matted dark fur, cracked skin glowing like embers, burning yellow eyes","wyrm":"the black wyrm, a huge black dragon: lean serpentine body, tattered black wings, ridged horns along the skull, glowing orange throat and eyes, smoke from its nostrils","wraith":"the wraith, a colossal hooded spectre: tattered grey-black robes, no face but cold blue light inside the hood, long skeletal hands, trailing cold mist"},"shots":[{"id":"s01","t":0,"in":"black","who":["lucien"],"fx":["embers","smoke"],"flicker":0.5,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"Close-up of Lucien Vale's hands tuning his lute beside a tavern fireplace, the rest of the room in darkness, a quiet moment before the story"},{"id":"s02","t":10.35,"in":"fade","who":["lucien","arthas","cedric","neeris"],"fx":["fog"],"flicker":0.3,"move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"The three half-brothers and Neeris the druid leaving a town at night along a lantern-lit lane, seen from behind, walking toward a dark forest"},{"id":"s03","t":21.6,"in":"ink","who":["lucien","arthas","cedric","neeris"],"fx":["fog","fireflies"],"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"A narrow forest path under a full moon, seen from behind: Lucien Vale, Arthas the paladin, Cedric the monk and Neeris the druid, tall men of normal human height, walking away from the viewer in single file between huge dark trees, moonlight falling in shafts through the mist"},{"id":"s04","t":33,"in":"fade","who":[],"fx":["fog"],"grade":"cold","move":{"from":[0.05,0.02,0.02],"to":[-0.04,0,0.12]},"scene":"A moon lake in a forest clearing at night: a still round lake glowing cold blue, tall standing stones around its shore, six heavy iron chains running from the stones down into the water, mist drifting on the surface"},{"id":"s05","t":41.9,"in":"cut","who":["arthas","lucien","cedric"],"fx":["fog"],"move":{"from":[0,0.04,0.02],"to":[0,0,0.18]},"scene":"Arthas the paladin kneeling at the edge of the glowing blue moon lake, one gauntlet off, a knife at his open palm, his two brothers watching behind him on the shore"},{"id":"s06","t":48.21,"in":"cut","who":[],"fx":["dust"],"move":{"from":[0.03,0,0.08],"to":[-0.03,0,0.16]},"scene":"Extreme close-up: drops of blood falling from a hand into the glowing blue water of a moonlit lake, the blue turning red where they land, ripples spreading"},{"id":"s07","t":54.08,"in":"flash","who":[],"fx":["sparks","smoke"],"shake":0.4,"grade":"red","move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"One of the six iron chains that run from the standing stones into the moon lake snapping, a single link bursting apart in a shower of sparks, the lake turning black as ink with red light seeping up from deep below, the other chains straining but holding"},{"id":"s08","t":56.48,"in":"cut","who":["baphomet"],"fx":["embers","smoke"],"grade":"red","move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"The moon lake gone black as ink, and just beneath the surface the enormous face of a goat-headed demon, long curved horns and burning yellow eyes, rippling, looking up from very deep below; nothing comes out of the water"},{"id":"s09","t":59.12,"in":"cut","who":["baphomet"],"fx":["smoke"],"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"Looking straight down onto the ink-black surface of the lake: deep beneath it, wholly under __cw.boards["09-saving-cobh"] = {"id":"saving-cobh","live":true,"cover":"s22","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","mara":"Mara, Lucien's only real friend: a strong, curvy, attractive barkeep in her thirties, broad shoulders and strong arms, thick auburn hair tied back, freckles, warm confident eyes, rolled-up linen sleeves, a leather apron and laced bodice, a tavern woman who can throw a drunk out by herself","aldraik":"Aldraik, the Ahm Dynasty's merchant master: a short, very fat human man, barely chest-high to the brothers, round belly straining a gaudy gold-embroidered black waistcoat, a big bald head, a huge bushy moustache and mutton chops, a gold tooth in a wide greedy grin, small shrewd scheming eyes, fat fingers covered in jeweled rings, a gold monocle on a chain, a fur-trimmed coat with the golden winged lion crest, a cigar; a loud, cocky, scheming boss of a villain","crackle":"Crackle, an eccentric young professor in his late twenties: very tall, slim and skinny with long limbs, a big shock of wild frizzy ginger hair standing up as if struck by lightning, a thin ginger moustache, a brass pince-nez on a chain, a long patched tweed coat with bulging pockets of brass instruments and copper wire, scorch marks on his sleeves, an eager, nervous, hopelessly-in-love face","caroline":"Caroline, Lucien's old girlfriend: a strikingly beautiful, elegant young woman, long sleek raven-black hair, dark eyes, a fitted deep-blue dress, a teasing, confident smile, far out of most men's league","mayor":"the mayor of Cobh: an older lady in her late sixties, small and upright, deeply lined stern face, thin pressed lips, sharp pale eyes, silver-white hair in a severe tight bun, a high-collared dark blue coat with silver buttons and a heavy silver chain of office, a walking cane; strict, proud, unamused","troll":"a blood troll as in the reference sheet but much bigger, three times a man's height: dark red blood-slick skin, hunched, long arms with claws, a jutting tusked jaw, small burning eyes, ragged black hair, a crude spiked club","commander":"the enemy commander, an orc warlord serving the Scarlet Wizards: a huge grey-green orc with tusks and a scarred face, a topknot of black hair, blackened plate armour with a blood-red Scarlet cloak and sash, a curved war horn at his belt","archers":"the commander's archers, a mixed band of orcs and human soldiers in dark leather with red hoods and sashes, longbows","oldman":"an old shopkeeper of an arcane curio shop: frail, bald with long white side-whiskers, half-moon spectacles, a faded purple robe, grief in his eyes"},"shots":[{"id":"s01","t":0,"in":"black","who":[],"fx":["fire","smoke","embers"],"grade":"red","flicker":0.6,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"in Cobh, a harbour town of grey stone and slate roofs by the sea, burning at night, fire on the rooftops, smoke across the moon, no people close"},{"id":"s02","t":9.6,"in":"fade","who":["commander"],"fx":["smoke","embers"],"grade":"red","flicker":0.5,"move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"On a burning rooftop above Cobh, the enemy commander raising a great curved war horn to his lips"},{"id":"s03","t":19.26,"in":"cut","who":[],"fx":["smoke","embers"],"grade":"red","flicker":0.5,"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"in Cobh, a harbour town of grey stone and slate roofs by the sea, a mixed horde of orcs, hulking hairy bugbears and human soldiers in red sashes fleeing back through the burning streets toward the gate"},{"id":"s04","t":23.23,"in":"flash","who":["troll"],"fx":["smoke","embers"],"grade":"red","shake":0.5,"flicker":0.5,"move":{"from":[0.05,0.02,0.02],"to":[-0.04,0,0.12]},"scene":"in Cobh, a harbour town of grey stone and slate roofs by the sea, the huge war troll still stomping through a burning street, a club in its fist, hunting"},{"id":"s05","t":26.34,"in":"cut","who":["trol __cw.boards["10-ahm-dynasty"] = {"id":"ahm-dynasty","live":true,"cover":"s22","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","wizard":"a Scarlet Wizard: a gaunt sorcerer with a shaved head covered in red arcane tattoos, layered blood-red robes with gold trim, cold eyes, fire or mist curling from his hands","mara":"Mara, Lucien's only real friend: a strong, curvy, attractive barkeep in her thirties, broad shoulders and strong arms, thick auburn hair tied back, freckles, warm confident eyes, rolled-up linen sleeves, a leather apron and laced bodice, a tavern woman who can throw a drunk out by herself","mother":"the brothers' mother: a tall, noble, beautiful lady in her fifties, graceful and upright, long silver-streaked dark hair braided with gold, fine high-cheekboned face, deep green travelling gown and a fur-lined grey cloak, a dignified bearing, warm but sorrowful eyes; here she wears a dark scarlet hooded cloak over her gown, a spy inside the Scarlet Wizards","valerys":"High Inquisitor Valerys, the stern father of Arthas and Cedric: a tall man in his sixties, close-cropped grey hair and a short grey beard, hard pale grey eyes, white and crimson inquisitor robes with a gold sun emblem on the chest, a heavy gold chain of office, a calm unreadable face","assassin":"a Scarlet assassin: a lean woman in close-fitting dark red leather with a hood and a half mask over her mouth, cold pale eyes, short black hair, a recurve bow and a quiver, knives at her belt","guard":"guards of the Ahm Dynasty, the merchant house: men in black and gold livery with gold-trimmed half-capes, steel breastplates, short swords and crossbows, a golden crest of a winged lion on the chest"},"shots":[{"id":"s01","t":0,"in":"black","who":[],"fx":["fog"],"flicker":0.3,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"A harbour town at night, a lantern-lit tavern with a warm window on a wet cobbled stree __cw.boards["11-hunger-grows"] = {"id":"hunger-grows","live":true,"cover":"s17","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","wizard":"a Scarlet Wizard: a gaunt sorcerer with a shaved head covered in red arcane tattoos, layered blood-red robes with gold trim, cold eyes, fire or mist curling from his hands","duncastle":"Duncastle, the Church's fortress between the forest and the plains: grey stone curtain walls with crenellations, square towers with ballistae on top, a tall timber-framed tower with a red tiled roof in the courtyard, wooden palisades, stables with a red roof","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","valerys":"High Inquisitor Valerys, the stern father of Arthas and Cedric: a tall man in his sixties, close-cropped grey hair and a short grey beard, hard pale grey eyes, white and crimson inquisitor robes with a gold sun emblem on the chest, a heavy gold chain of office, a calm unreadable face","baphomet":"Baphomet, a goat-headed demon imprisoned deep beneath a moonlit lake, only ever seen as an enormous face beneath its black water, never rising out of it: long curved black horns, matted dark fur, cracked skin glowing like embers, burning yellow eyes","silas":"Silas, a lean human dock smuggler in his thirties: buzzed dark hair, stubble, sunken nervous eyes, drab grey-olive patched coat, rope belt, ink-stained fingers","wolfsilas":"Silas the werewolf, exactly as in the reference painting but further gone, more wolf than man: the lean dock smuggler with a full wolf snout and fangs, coarse dark brown fur over his face, arms and back, wild glowing yellow eyes, pointed ears, clawed hands, hunched, his drab grey-olive patched coat and rope belt torn to rags; frightening, not comical","imp":"an imp: a nasty little fiend the size of a dog, dark red leathery skin, small torn bat wings, short horns, a barbed tail, long claws, needle teeth, and a fat swollen belly that glows from inside with orange fire through cracks in the skin, about to burst; menacing and grotesque, not cute, no clothes"},"shots":[{"id":"s01","t":0,"in":"black","who":[],"fx":["dust"],"flicker":0.4,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"An empty narrow worn stone stair spiralling down into total darkness, a single torch flame far below, no people at all"},{"id":"s02","t":8.4,"in":"fade","who":["lucien","arthas","cedric"],"fx":["dust","fog"],"flicker":0.5,"move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"The three brothers descending the narrow stone stair in single file, Arthas first with a torch, Lucien Vale (long blond hair, pointed ears, burgundy coat) in the middle, Cedric last, seen from below, deep shadow"},{"id":"s03","t":17.04,"in":"cut","who":["lucien"],"fx":["dust"],"flicker":0.4,"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"in the stone cellars deep below the Ahm safehouse, a cramped study, Lucien Vale (long blond hair, pointed ears, burgundy coat) holding up a report with a charcoal sketch of his own face on it, by candlelight, his face hardening (no readable text)"},{"id":"s04","t":21.94,"in":"cut","who":[],"fx":["dust"],"flicker":0.4,"move":{"from":[0.05,0.02,0.02],"to":[-0.04,0,0.12]},"scene":"in the stone cellars deep below the Ahm safehouse, an empty room: a heavy door sealed with chains and wax seals, beside it a desk covered in ledgers and letters, names written in ink, candlelight, no people at all"},{"id":"s05","t":26.99,"in":"cut","who":[],"fx":["dust"],"flicker":0.3,"move":{"from":[0,0.04,0.02],"to":[0,0,0.18]},"scene":"Tight close-up of two wax seals pressed side by side on one letter: a golden dynasty crest and a blood-red open hand, candlelight, no readable text"},{"id":"s06","t":32.06,"in":"cut","who":["arthas","cedric","lucien"],"fx":["d __cw.boards["12-fall-duncastle"] = {"id":"fall-duncastle","live":true,"cover":"s21","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","mara":"Mara, Lucien's only real friend: a strong, curvy, attractive barkeep in her thirties, broad shoulders and strong arms, thick auburn hair tied back, freckles, warm confident eyes, rolled-up linen sleeves, a leather apron and laced bodice, a tavern woman who can throw a drunk out by herself","valerys":"Oathbreaker Valerys, the High Inquisitor fallen: a tall man in his sixties, close-cropped grey hair and short grey beard, hard pale grey eyes, his white and crimson inquisitor robes and gold sun emblem blackened and cracked, dark corrupted plate beneath, a cold dark fire and pale light burning around him","wizard":"a Scarlet Wizard: a gaunt sorcerer with a shaved head covered in red arcane tattoos, layered blood-red robes with gold trim, cold eyes, fire or mist curling from his hands","giant":"the chained giant: an enormous ogre-like brute four times a man's height, grey warty skin, small eyes, heavy iron chains and shackles on its limbs and neck, goblins in leather riding on its shoulders holding chain reins","serpent":"the serpent: a colossal pale worm-like serpent rising from the earth, ridged grey-white hide, a huge round mouth ringed with teeth, dirt and stones falling from it","duncastle":"Duncastle, the Church's fortress between the forest and the plains: grey stone curtain walls with crenellations, square towers with ballistae on top, a tall timber-framed tower with a red tiled roof in the courtyard, wooden palisades, stables with a red roof","mother":"the brothers' mother: a tall, noble, beautiful lady in her fifties, graceful and upright, long silver-streaked dark hair braided with gold, fine high-cheekboned face, deep green travelling gown and a fur-lined grey cloak, a dignified bearing, warm but sorrowful eyes"},"shots":[{"id" __cw.boards["13-down-deep"] = {"id":"saving-cobh","live":true,"cover":"s16","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","valerys":"Oathbreaker Valerys, the High Inquisitor fallen: a tall man in his sixties, close-cropped grey hair and short grey beard, hard pale grey eyes, his white and crimson inquisitor robes and gold sun emblem blackened and cracked, dark corrupted plate beneath, a cold dark fire and pale light burning around him","serpent":"the serpent: a colossal pale worm-like serpent rising from the earth, ridged grey-white hide, a huge round mouth ringed with teeth, dirt and stones falling from it","kaelen":"Kalen Stormshield, the human Church paladin the brothers know (the same man as before), carrying a longbow: a broad young man in his twenties, short brown hair, a square jaw, dented white-and-steel Church plate with a gold sun emblem, torn white tabard, bloodied and bruised","soldiers":"five Church soldiers in battered white-and-steel armour with spears and torches","darius":"Darius, a human soldier of the castle from above: a weathered man in his forties, short dark hair and stubble, battered white-and-steel Church soldier armour like the other soldiers, a torch","dolkan":"Dolkan, a mad old duergar: a short, stocky grey-skinned dwarf, bald with a wild white beard, bulging glowing eyes, tattered dark leathers, a lantern on a pole, cackling","wittan":"Wittan, a deep gnome (svirfneblin): small, grey stone-coloured skin, bald, big nose and ears, dark eyes, practical grey leathers and a pick","bulette":"a bulette, a land shark, a real living beast painted in the same style as everything else (not a figurine): a huge armoured burrowing beast with a grey-green shell of stone-like plates and spiky dorsal plates, a shark-like toothed mouth, clawed forelegs","cavern":"the cavern from the reference photo of the tabletop, painted as a real underground place at full s __cw.boards["14-hunt-valerys-real"] = {"id":"hunt-valerys-real","live":true,"cover":"s28","style":"Photorealistic cinematic film still from a big-budget dark fantasy film, the look of a high-end fantasy series shot on an ARRI Alexa with anamorphic lenses: real actors, real caves and practical sets, real costumes with wear, dirt and texture, natural skin with pores and imperfections, physically accurate light from torches, fire, glowing fungus and crystals, deep shadows, atmospheric haze and dust in the light, subtle film grain, shallow depth of field, rich cinematic colour grading. Creatures look like real living animals with real anatomy, wet and heavy and lit like everything else: never CGI-looking, never rubber, never toys, statues or miniatures. Grounded faces with real emotion. Full-bleed 16:9 frame edge to edge: no letterbox bars, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a real man of about 28, a half-elf wild magic sorcerer who sings and plays the flute, charming and haunted: long straight blond hair, long pointed elf ears, a handsome clean-shaven face with fine elven features and a slim straight nose, lively expressive blue-grey eyes with tired shadows, a burgundy velvet long coat with brass buttons over a dark shirt, worn and stained from the road, a leather belt with a dagger whose blade glows faintly blue, faint purple sparks at his fingertips when he casts, a wooden flute at his belt, slim build","arthas":"Arthas, a tall devout human paladin, his face never seen: full dark steel plate armour, battered and scratched, a dark cloth hood always worn up over a closed steel great helm, two narrow eye slits glowing burning orange, broad shoulders, a heavy bronze-hilted longsword whose blade burns orange, a faded holy sun emblem on his breastplate","cedric":"Cedric 'Cold-Eye', a real man of about 30, a human monk: shaved head, short dark beard, hard pale grey eyes, weathered skin with small scars, red and brown leather wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry and strong","valerys":"Oathbreaker Valerys, the fallen High Inquisitor, a real man in his sixties: close-cropped grey hair, short grey beard, hard pale grey eyes, his white and crimson inquisitor robes and gold sun emblem blackened and torn, dark corrupted plate beneath it in pieces, badly wounded and bloodied, a glowing golden longsword in his hand","serpent":"the wurm: a colossal pale worm-like creature rising from the earth, ridged grey-white hide like wet leather and stone, a huge round mouth ringed with rows of teeth, dirt and rocks falling from it, real weight and scale. Photographed like a real animal: wet slimy segmented hide with scars, mud and roots stuck to it, translucent flesh at the mouth, dripping, enormous and heavy, nothing cartoonish, not clay, not CGI","wittan":"Wittan, a deep gnome (svirfneblin), a real small person about one metre tall: grey stone-coloured skin, bald, a big nose and large ears, dark eyes, practical worn grey leathers, a pick and a small lantern","drow":"Nerrissa, a drow woman (dark elf), 25: exactly the woman in her reference photographs (same face, high sharp cheekbones, narrow nose, almond violet eyes, faint scar through her left eyebrow, full lips usually closed in a knowing half-smile, long pointed ears, long straight centre-parted silver hair), naturally dark purple-grey skin with real texture, no makeup look; athletic and graceful, a full bust; worn dark leather hunter armour with silver trim and a high collar, two curved silver blades; a monster hunter","baphomet":"Baphomet, a vast goat-headed demon chained deep underground: long curved black horns, matted dark fur, cracked skin glowing like embers from within, burning yellow eyes, colossal and ancient, lit like a real creature","flower":"the memory-eater, a real living monster about the size of a bear: a squat beast whose head is one huge round mouth ringed with rows of white fangs and a corona of fleshy yellow-orange petal-like tendrils, a flower of teeth; a back covered in long grey spines, four gnarled bark-brown arms each holding a living flame in its claw, a thick scaly grey lower body. Photographed like a real animal in a natural-history film: wet glistening organic flesh, translucent petal tendrils with veins, yellowed real teeth, mud and moss on the spines, heavy and dangerous, nothing cute, not a toy, not a sculpture, not CGI","reaper":"the well-keepers, real gaunt creatures taller than a man: emaciated grey bodies with visible ribs wrapped in tattered black and deep-blue rags, a crown of jagged black spines on the head, one pale silver eye in the middle of the face, long thin arms ending in curved silver sickle-blades"},"shots":[{"id":"s01","t":0,"in":"black","who":[],"fx":["dust"],"grade":"cold","move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"deep underground in the Down Deep, a lightless world of caverns, rock ceilings, no sky, a real place at full scale, a vast black cavern, one tiny warm glow far below, no people"},{"id":"s02","t":3.81,"in":"fade","who":["lucien","drow"],"fx":["dust"],"flicker":0.3,"move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"deep underground in the Down Deep, a lightless world of caverns, rock ceilings, no sky, a real place at full scale, in a small carved stone room in Thorman's camp, sleeping furs on the floor, a dying ember fire, warm amber light, Lucien Vale (long blond hair, pointed ears, burgundy coat) asleep on the furs with Nerrissa (the drow woman: dark purple-grey skin, long silver hair) curled against him, ember glow, exactly these people and no one else"},{"id":"s03","t":8.37,"in":"cut","who":[],"fx":["dust"],"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"deep underground in the Down Deep, a lightless world of caverns, rock ceilings, no sky, a real place at full scale, a single glowing amber mushroom blooming in total darkness, a light where no __cw.boards["14-hunt-valerys"] = {"id":"hunt-valerys","live":true,"cover":"s28","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a wooden flute at his belt, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedr $('bRew').onclick = () => seekBy(-10); $('bFwd').onclick = () => seekBy(10);
$('bVol').onclick = toggleMute; $('bCC').onclick = toggleCC; $('bFull').onclick = toggleFull;
$('bExit').onclick = toList; $('bBack').onclick = toList; $('bAgain').onclick = again;
$('bRot').onclick = () => { document.body.classList.toggle('rot'); resize(); };
// settings menu: brightness, camera, lyric sync
let menuOpen = false;
function closeMenu() { menuOpen = false; $('menu').hidden = true; }
function menuLabels() {
  $('mBright').textContent = 'Brightness · ' + ['Normal', 'Bright', 'Brighter', 'Dim'][expI];
  $('mCalm').textContent = 'Camera · ' + (calm ? 'Calm' : 'Lively');
}
$('bSet').onclick = (e) => { e.stopPropagation(); menuOpen = !menuOpen; $('menu').hidden = !menuOpen; menuLabels(); showControls(); };
$('mBright').onclick = () => { expI = (expI + 1) % EXPOS.length; if (renderer) renderer.toneMappingExposure = EXPOS[expI]; menuLabels(); };
$('mCalm').onclick = () => { calm = !calm; store.set('calm', calm ? '1' : '0'); menuLabels(); };
$('mSync').onclick = () => { closeMenu(); syncStart(); };
// seek bar: click or drag anywhere on it (runs down the screen in the turned-sideways view)
let scrubbing = false;
function seekFrac(e) {
  const r = $('seek').getBoundingClientRect(), rot = document.body.classList.contains('rot');
  return clamp(rot ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width, 0, 1);
}
$('seek').addEventListener('pointerdown', (e) => { if (!story) return; scrubbing = true; $('seek').setPointerCapture(e.pointerId); $('seek').classList.add('drag'); seekTo(seekFrac(e) * story.duration); e.stopPropagation(); });
$('seek').addEventListener('pointermove', (e) => {
  if (!story) return; const k = seekFrac(e);
  $('seektip').textContent = fmt(k * story.duration); $('seektip').style.left = (k * 100).toFixed(2) + '%';
  if (scrubbing) seekTo(k * story.duration);
});
['pointerup', 'pointercancel'].forEach((n) => $('seek').addEventListener(n, () => { scrubbing = false; $('seek').classList.remove('drag'); }));
addEventListener('keydown', (e) => {
  if (!story || e.target.tagName === 'TEXTAREA') return;
  const k = e.code;
  if (syncing && k === 'Space') { e.preventDefault(); tap(); return; }
  if (k === 'Space' || k === 'KeyK') { e.preventDefault(); togglePlay(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); seekBy(-5); } else if (k === 'ArrowRight') { e.preventDefault(); seekBy(5); }
  else if (k === 'KeyJ') seekBy(-10); else if (k === 'KeyL') seekBy(10);
  else if (k === 'KeyM') toggleMute(); else if (k === 'KeyF') toggleFull(); else if (k === 'KeyC') toggleCC();
  else if (k === 'Escape') { if (menuOpen) closeMenu(); else if (!document.fullscreenElement) toList(); }
  else if (k === 'KeyD') { const d = $('dev'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
  else if (/^Digit\d$/.test(k)) seekTo(story.duration * (+k.slice(5)) / 10);
});
let hintT = 0;
function hint(text, ms) { const h = $('hint'); h.textContent = text; h.classList.add('on'); clearTimeout(hintT); hintT = setTimeout(() => h.classList.remove('on'), ms || 4000); }

/* ---------- lyric sync (settings menu: tap to the real vocals) ---------- */
let syncing = false, taps = [];
function syncShow() {
  const f = story.flat, n = taps.length;
  $('syncLine').textContent = n < f.length ? (n + 1) + '/' + f.length + '  ' + f[n].tx : 'All lines tapped.';
  $('bTap').disabled = n >= f.length;
}
function syncStart() {
  syncing = true; taps = []; story.flat = flatLines(story);
  seekTo(0); audio.play();
  $('sync').hidden = false; $('syncOut').hidden = true; $('sync').querySelector('.row').hidden = false; $('lyric').classList.remove('on'); lastLine = null; syncShow();
}
function tap() { if (!syncing || taps.length >= story.flat.length) return; taps.push(+Math.max(0, audio.currentTime - 0.2).toFixed(2)); syncShow(); }
$('bTap').onclick = tap;
$('bUndo').onclick = () => { taps.pop(); syncShow(); };
$('bSyncDone').onclick = () => {
  const full = taps.length === story.flat.length;
  if (full) { story.times = taps.slice(); store.set(story.id, JSON.stringify(taps)); }
  const o = $('syncOut'); o.value = JSON.stringify(taps); o.hidden = false; o.focus(); o.select();
  try { navigator.clipboard.writeText(o.value).catch(() => { }); } catch (e) { }
  syncing = false; $('sync').querySelector('.row').hidden = true; $('syncLine').textContent = full ? 'Saved on this device and copied. Send me these numbers to bake them in.' : 'Incomplete, so not applied.';
  setTimeout(() => { $('sync').hidden = true; }, 9000);
};

/* ---------- lyrics ---------- */
const cueAt = (t) => { let k = 0; story.cues.forEach((c, i) => { if (c.t <= t) k = i; }); return k; };
let lastLine = null, lastTitle = null;
function flatLines(s) { const a = []; s.cues.forEach((c, ci) => (c.lines || []).forEach((tx, k) => a.push({ ci, k, tx }))); return a; }
function loadTimes(s) {
  s.flat = flatLines(s);
  let tm = s.lineTimes || null;
  try { const v = JSON.parse(store.get(s.id, 'null')); if (v && v.length === s.flat.length) tm = v; } catch (e) { }
  s.times = tm;
}
function lyricsAt(t) {
  // name cards: who someone is, the first time they appear (level `titles: [{ t, name, sub, dur }]`)
  const tc = (story.titles || []).find((x) => t >= x.t && t < x.t + (x.dur || 4.5)) || null;
  if (tc !== lastTitle) { lastTitle = tc; if (tc) { $('title').firstChild.textContent = tc.name; $('title').lastChild.textContent = tc.sub || ''; } $('title').classList.toggle('on', !!tc); }
  let line = '', voice = '';  // voice: a level with `voices` (one per line, e.g. 'b') marks the second speaker's lines
  if (captions && !syncing) {
    if (story.times) {
      const tm = story.times; let k = -1;
      for (let j = 0; j < tm.length; j++) if (tm[j] != null && tm[j] <= t) k = j; else if (tm[j] != null) break;
      if (k >= 0) { const nxt = k + 1 < tm.length ? tm[k + 1] : 1e9; if (t < Math.min(nxt - 0.1, tm[k] + 7)) { line = story.flat[k].tx; voice = story.voices ? story.voices[k] || '' : ''; } }
    } else {
      const cues = story.cues, i = cueAt(Math.max(0, t)), c = cues[i], nx = cues[i + 1], end = nx ? nx.t : story.duration;
      if (c.lines && c.lines.length && t >= c.t) {
        const a = c.t + 0.4, b = end - 0.4, n = c.lines.length, seg = (b - a) / n;
        if (t >= a && t < b) { const k = Math.min(n - 1, Math.floor((t - a) / seg)); if ((t - a) - k * seg < seg - 0.5) line = c.lines[k]; }
      }
    }
  }
  if (line !== lastLine) { lastLine = line; const el = $('lyric'); if (line) { el.textContent = line; el.classList.toggle('b', voice === 'b'); el.classList.add('on'); } else el.classList.remove('on'); }
}

/* ---------- loop ---------- */
let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  if (dev.hold) { dev.shot(dev.hold); return; }
  if (!story || !P) return;
  const t = audio.currentTime;
  if (shown && now - lastActive > 3000) hideControls();
  lyricsAt(t);
  if (!scrubbing || true) {
    const k = clamp(t / story.duration, 0, 1);
    $('seekfill').style.width = (k * 100).toFixed(3) + '%'; $('seekknob').style.left = (k * 100).toFixed(3) + '%';
    $('ptime').textContent = fmt(t) + ' / ' + fmt(story.duration);
  }
  if (!ended && t >= story.silenceT) finish();
  if ($('dev').style.display === 'block') $('dev').textContent = 'fps ' + fps.toFixed(0) + '\nt ' + t.toFixed(1) + '  cue ' + story.cues[cueAt(Math.max(0, t))].id + '  shot ' + P.info().shot;
  P.render(t, time, calm);
}
// dev hooks for the headless tools: dev.hold = { t, time } renders that moment instead of the live song
const dev = { hold: null, painted: P, shot(st) { if (story && P) P.render(st.t, st.time, true); }, play(s) { story = s; loadTimes(s); P.start(s); } };
resize();
requestAnimationFrame(frame);
window.__alaron = { renderer, dev, audio, get mode() { return story ? 'ride' : 'list'; }, get story() { return story; }, seek: seekTo, play: (id) => { const s = C.stories.find((x) => x.id === id); if (s) playFromList(s, document.createElement('button')); } };
})();

</script>
