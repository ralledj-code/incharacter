button:hover { border-color: var(--ember); }

<div id="start">
  <header id="songsHead">
    <h1>Alaron Chronicle</h1>
    <p>The songs of Lucien Vale, one for each chapter of the campaign. Pick one and watch the story it tells.</p>
  </header>
  <div id="songs" role="list"></div>
  <div id="tavernRow">
    <button id="go" disabled>Loading the world…</button>
    <small>Or step into the tavern and ask Lucien yourself. Headphones help.</small>
  </div>
</div>

<div class="layer" id="top" hidden>
  <button id="bBright" title="Brightness">Brightness</button>
  <button id="bMute" title="Mute (M)">Sound on</button>
  <button id="bPause" title="Pause (Space)" hidden>Pause</button>
  <button id="bSync" title="Tap lyrics to the real vocals" hidden>Sync lyrics</button>
  <button id="bCalm" title="Camera kicks and shake on the beat">Wild camera</button>
  <button id="bRot" title="Show the picture sideways (for a phone with rotation lock)" hidden>Landscape</button>
  <button id="bClose" title="Close the book" hidden>Close the book</button>
</div>

<div class="layer" id="hud" hidden>
  <div id="hint"></div>
  <div class="row" id="rowSit" hidden><button id="bSit" class="primary">Ask Lucien for a song</button><button id="bAuto">Walk me there</button></div>
  <div class="row" id="rowBook" hidden><button id="bPrev" aria-label="Previous page">◀</button><button id="bBegin" class="primary">Begin this story</button><button id="bNext" aria-label="Next page">▶</button></div>
  <div id="sync" hidden>
    <div id="syncLine"></div>
    <div class="row"><button id="bTap" class="primary">Tap when this line starts</button><button id="bUndo">Undo</button><button id="bSyncDone">Done</button></div>
    <textarea id="syncOut" readonly rows="3" hidden></textarea>
  </div>
  <div id="stamp"></div>
  <div id="lyric" aria-live="polite"></div>
</div>
<div id="title" aria-hidden="true"><b></b><span></span></div>
<button id="walkpad" aria-label="Hold to walk forward">Walk</button>
<div id="prog"><i></i></div>

<div id="end" hidden>
  <h2>Lucien takes a bow.</h2>
  <p>The tavern roars for another.</p>
  <div id="endbtns"><button id="bBack" class="primary">Back to the tavern</button><button id="bAgain">Play it again</button></div>
</div>
<div id="coach" role="status" aria-live="polite"></div>
<div id="dev"></div>

/* the chorus roads (both choruses; the second with the brothers and the hunters' torches) */
function chorusRoad(X, secId, line0, brothers) {
  const S = X.sec[secId], kit = C.kit(X), ch = chars(X), g = new THREE.Group(), L = X.line;
  const dEnd = brothers ? X.sec.inst.d1 + 4 : S.d1 + 4;

  // the road

  const dS = S.d0 + 10, dStop = dS + (L(line0 + 3) - S.t0) * 1.15;

    const w = C.creature('wolf', { h: 0.95, tint: 0x3a3438, eyes: 0xff2a10 }); if (!w) break;

      { gait: [['Walk', 0.69], ['Gallop', 2.57]], idle: 'Idle' }));
  }
  // merchants (chorus 1) or hunters with torches (chorus 2) on the right

    const p = ch.person({ seed: (brothers ? 3100 : 3000) + i * 9, female: false, tint: pick([0x7a1a1a, 0x8a3a2a, 0x5a2a2a]), pose: brothers || i % 2 ? 'Idle_Torch_Loop' : 'Idle_Loop' });

    if (brothers || i % 2) { const f = X.glow(0xffa040, 1.3, 0.85); f.position.copy(X.at(d - 0.3, sd - 0.4, 2.0)); g.add(f); torches.push(f); }
  }
  if (!brothers) { put(g, 'Prop_Wagon', X.at(dS + (dStop - dS) * 0.55, 9.5, 0), X.yawAt(dS) + 0.3, 2.2); put(g, 'Barrel', X.at(dS + (dStop - dS) * 0.55 + 2.6, 8, 0), 0, 1.0); }
  // Lucien walks the road between them (with his brothers the second time), stops, turns: "it is mine"
  const lu = ch.lucien({ pose: 'Idle_Loop' }); lu.userData.blade.visible = false; lu.userData.bladeGlow.visible = false; g.add(lu); lu.position.copy(X.at(dS, 0, 0));

    { t: L(line0 + 3), pose: 'Idle_Loop', face: X.at(dStop - 10, 0, 0) },
    { t: L(line0 + 4, -0.2), pose: 'Spell_Simple_Idle_Loop', face: X.at(dStop - 10, 0, 0) }]));
  if (brothers) {

      const b = ch[who]({ pose: 'Idle_Loop' }); g.add(b); b.position.copy(X.at(dS - 1.4, sd, 0)); cast.push(b);
      acts.push(C.act(b, [{ t: 0, face: X.at(dS + 4, sd, 0) }, { t: S.t0 + 0.4, to: railPts(X, dS - 1.4, dStop - 1.4, sd), by: L(line0 + 3, 0.3) }, { t: L(line0 + 3, 0.3), pose: who === 'arthas' ? 'Sword_Idle' : 'Idle_Loop', face: X.at(dStop - 10, sd, 0) }]));

__cw.boards["01-first-steps"] = {"id":"first-steps","live":true,"cover":"s02","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","silas":"Silas, a lean human dock smuggler in his thirties: buzzed dark hair, stubble, sunken nervous eyes, drab grey-olive patched coat, rope belt, ink-stained fingers","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","guildmen":"two different burly trade-guild enforcers, clearly two distinct men: one bald and heavy-set with a short red beard, one taller with greasy black hair and a scar across the cheek; both in bright crimson red wool coats with brass guild badges, red angry faces, cudgels at their belts"},"shots":[{"id":"s01","t":0,"in":"black","who":["lucien"],"fx":["embers","smoke"],"flicker":0.6,"move":{"from":[0,0.06,0],"to":[0,0.05,0.12]},"focus":[0.5,0.5],"scene":"Extreme close shot of a dying campfire at night in a pine forest, a few glowing logs and embers, behind it the warm-lit face and hands of Lucien Vale tuning his lute, eyes down, darkness all around"},{"id":"s02","t":8.2,"in":"fade","who":["lucien"],"fx":["embers"],"flicker":0.5,"move":{"from":[-0.04,0,0.05],"to":[0.03,0,0.12]},"focus":[0.45,0.4],"scene":"Medium close-up of Lucien Vale by a low campfire, looking up from his lute straight at the viewer as if about to tell a story, firelight on one side of his face, cold blue night on the other"},{"id":"s03","t":12.5,"in":"ink","who":[],"fx":["dust"],"move":{"from":[0,0,0],"to":[0.02,-0.02,0.2]},"focus":[0.5,0.55],"scene":"Still life on a rough tavern table lit by one candle: two bone dice, a small cloth pouch of dark herbs and a glass vial, a few copper coins, deep shadows, painterly","flicker":0.45},{"id":"s04","t":16.8,"in":"ink","who":[],"fx":["fog"],"move":{"from":[0 __cw.boards["02-finding-silas"] = {"id":"finding-silas","live":true,"cover":"s21","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","mara":"Mara, Lucien's only real friend: a strong, curvy, attractive barkeep in her thirties, broad shoulders and strong arms, thick auburn hair tied back, freckles, warm confident eyes, rolled-up linen sleeves, a leather apron and laced bodice, a tavern woman who can throw a drunk out by herself","mother":"the brothers' mother: a tall, noble, beautiful lady in her fifties, graceful and upright, long silver-streaked dark hair braided with gold, fine high-cheekboned face, deep green travelling gown and a fur-lined grey cloak, a dignified bearing, warm but sorrowful eyes","assassin":"a Scarlet assassin: a lean woman in close-fitting dark red leather with a hood and a half mask over her mouth, cold pale eyes, short black hair, a recurve bow and a quiver, knives at her belt","guard":"guards of the Ahm Dynasty, the merchant house: men in black and gold livery with gold-trimmed half-capes, steel breastplates, short swords and crossbows, a golden crest of a winged lion on the chest","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","silas":"Silas, a lean human dock smuggler in his thirties: buzzed dark hair, stubble, sunken nervous eyes, drab grey-olive patched coat, rope belt, ink-stained fingers","wolfsilas":"Silas the werewolf, exactly as in the reference painting: the lean dock smuggler turned, a full wolf snout and fangs, coarse dark brown fur, wild glowing yellow eyes, clawed hands, his drab grey-olive patched coat torn to rags; frightening, not comical","wife":"Silas's wife, half-turned werewolf: a thin poor dockside woman in her thirties in a ragged grey dress and shawl, dark tangled  human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","pig":"the Pig, a hulking humanoid butcher about three metres tall with the head of a pig: heavy jowls, short tusks, small cruel eyes, reddish-pink skin, a leather butcher's apron soaked in blood, thick arms, a huge broadaxe, covered head to toe in blood","moonwell":"the first moonwell site, laid out as in the reference photo of the tabletop model","carius":"Carius, a man from the small village of Lehai: a farmer in his forties, plain brown tunic, muddy, terrified, rescued","poles":"the circle of twelve poles in the town square, as in the reference painting","wolves":"werewolves: hulking grey and brown wolf-men with snouts, fangs, glowing yellow eyes, ragged fur and torn clothes, carrying burning torches","troll":"a blood troll: a hulking, hunched cave troll twice a man's height, dark red blood-slick skin, long arms with claws, a jutting jaw with tusks, small burning eyes, ragged hair","werebear":"werebears that control their shape: big bearded men in fur-trimmed leather, and the same men as huge brown bears, or half man half bear, calm and proud"},"shots":[{"id":"s01","t":0,"in":"black","who":["lucien"],"fx":["fog"],"grade":"cold","move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"in the square of a small poor village at dusk, thatched houses, night, seen from behind: Lucien Vale (long blond hair, pointed ears, burgundy coat) crouched on the edge of a thatched rooftop, rose petals in the wind, the square far below"},{"id":"s02","t":9,"in":"fade","who":[],"fx":["fog","embers"],"grade":"red","flicker":0.4,"move":{"from":[-0.04,0,0.05],"to":[0.04,0 __cw.boards["06-slaying-pig"] = {"id":"slaying-pig","live":true,"cover":"s03","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","baphomet":"Baphomet, a goat-headed demon imprisoned deep beneath a moonlit lake, only ever seen as an enormous face beneath its black water, never rising out of it: long curved black horns, matted dark fur, cracked skin glowing like embers, burning yellow eyes","pig":"the Pig, a hulking humanoid butcher about three metres tall with the head of a pig: heavy jowls, short tusks, small cruel eyes, reddish-pink skin, a leather butcher's apron soaked in blood, thick arms, a huge broadaxe","valerys":"High Inquisitor Valerys, the stern father of Arthas and Cedric: a tall man in his sixties, close-cropped grey hair and a short grey beard, hard pale grey eyes, white and crimson inquisitor robes with a gold sun emblem on the chest, a heavy gold chain of office, a calm unreadable face","prisoner":"the last prisoner, a gaunt townsman of Stagford in his thirties: torn grey rags, dark stubble, hollow cheeks, shackled wrists, dirty and exhausted"},"shots":[{"id":"s01","t":0,"in":"black","who":[],"fx":["smoke","embers"],"flicker":0.4,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"Establishing shot of the Pig's slaughterhouse deep inside a mountain: vast cut-stone halls, meat hooks and chains, braziers, a massive pool of blood glowing dark red in the middle of the great hall, smoke hanging in the air"},{"id":"s02","t":10.35,"in":"fade","who":["pig"],"fx":["smoke","embers"],"flicker":0.5,"move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"The Pig at the edge of the blood pool: a hulking humanoid butcher with a pig's head, a blood-soaked leather apron, raising a huge broadaxe, braziers behind him"},{"id":"s03","t":20.35,"in":"cut","who":["lucien","arthas","cedric","pig"],"fx":["embers","sparks"],"flicker":0.5,"shake":0.3,"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"The three brothers driving the Pig back around the great pool of blood: Arthas's sword, Cedric's staff, Lucien throwing fire, the butcher stumbling"},{"id":"s04","t":25.39,"in":"cut","who":[],"fx":["smoke","embers"],"flicker":0.7,"move":{"from":[0.05,0.02,0.02],"to":[-0.04,0,0.12]},"scene":"High in the great hall's wall, a barred window of a room already ablaze, thick black smoke pouring out over the hall"},{"id":"s05","t":30.16,"in":"cut","who":["lucien"],"fx":["embers"],"flicker":0.6,"move":{"from":[0,0.04,0.02],"to":[0,0,0.18]},"scene":"Lucien Vale lowering his burning hand, the fire in his palm dying, his face lit from below as he realises what the burning room holds"},{"id":"s06","t":34.78,"in":"cut","who":[],"fx":["embers","smoke"],"flicker":0.8,"move":{"from":[0.03,0,0.08],"to":[-0.03,0,0.16]},"scene":"Silhouettes of prisoners behind the flames of the burning window, only shapes in the fire and smoke, leave the rest to imagination"},{"id":"s07","t":39.74,"in":"cut","who":["lucien"],"fx":["ash"],"flicker":0.5,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"Close-up of Lucien Vale in anguish, tears cutting through soot on his face, eyes up toward the burning room, God forgive me"},{"id":"s08","t":48.52,"in":"fade","who":["lucien","arthas","cedric"],"fx":["smoke","ash"],"flicker":0.4,"move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"The great hall filling with black smoke, the three brothers small figures by the blood pool, Lucien sinking to his knees"},{"id":"s09","t":58.9,"in":"ink","who":["pig","arthas"],"fx":["dust"],"shake":0.4,"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"The Pig dragging Arthas the paladin down under the surface of the blood pool, the dark plate armour sinking, a great splash of dark red"},{"id": -Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","neris":"Neris, a wiry forest druid in his forties who carries a wolf curse: moss-green hooded ranger cloak over worn leather, a gnarled wooden staff, gaunt weathered face, unkempt dark hair and short beard, amber eyes, a haunted desperate look","valerys":"High Inquisitor Valerys, the stern father of Arthas and Cedric: a tall man in his sixties, close-cropped grey hair and a short grey beard, hard pale grey eyes, white and crimson inquisitor robes with a gold sun emblem on the chest, a heavy gold chain of office, a calm unreadable face","mara":"Mara, Lucien's only real friend: a strong, curvy, attractive barkeep in her thirties, broad shoulders and strong arms, thick auburn hair tied back, freckles, warm confident eyes, rolled-up linen sleeves, a leather apron and laced bodice, a tavern woman who can throw a drunk out by herself","aldraik":"Aldraik, the Ahm Dynasty's merchant master: a short, very fat human man, barely chest-high to the brothers, round belly straining a gaudy gold-embroidered black waistcoat, a big bald head, a huge bushy moustache and mutton chops, a gold tooth in a wide greedy grin, small shrewd scheming eyes, fat fingers covered in jeweled rings, a gold monocle on a chain, a fur-trimmed coat with the golden winged lion crest, a cigar; a loud, cocky, scheming boss of a villain","guard":"guards of the Ahm Dynasty, the merchant house: men in black and gold livery with gold-trimmed half-capes, steel breastplates, short swords and crossbows, a golden crest of a winged lion on the chest","lake":"the moon lake of Cobh, as in the reference painting","mayor":"the mayor of Cobh: an older lady in her late sixties, small and upright, deeply lined stern face, thin pressed lips, sharp pale eyes, silver-white hair in a severe tight bun, a high-collared dark blue coat with silver buttons and a heavy silver chain of office, a walking cane; strict, proud, unamused","leify":"Leify, Lucien's old fling: a very beautiful young woman in her twenties, long wavy chestnut hair, green eyes, freckles, a tavern waitress's laced bodice and apron, a cool, unimpressed look","caroline":"Caroline, Lucien's old girlfriend: a strikingly beautiful, elegant young woman, long sleek raven-black hair, dark eyes, a fitted deep-blue dress, a teasing, confident smile, far out of most men's league","crackle":"Crackle, an eccentric young professor in his late twenties: very tall, slim and skinny with long limbs, a big shock of wild frizzy ginger hair standing up as if struck by lightning, a thin ginger moustache, a brass pince-nez on a chain, a long patched tweed coat with bulging pockets of brass instruments and copper wire, scorch marks on his sleeves, an eager, nervous, hopelessly-in-love face","father":"Leify's father: a big, rough, burly man in his fifties with a red face and thick beard, a dock worker's clothes","kin":"well-dressed merchants of Cobh, men and women in rich dark clothes with gold rings, smug"},"shots":[{"id":"s01","t":0,"in":"black","who":[],"fx":["fog"],"flicker":0.3,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"A great white stone cathedral at dusk, candlelit windows, no people"},{"id":"s02","t":8,"in":"fade","who":["valerys","lucien","arthas","cedric"],"fx":["dust"],"flicker":0.3,"move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"In a candlelit cathedral chamber, High Inquisitor Valerys behind his desk facing the three brothers, Lucien Vale (long blond hair, pointed ears, burgundy coat) "},{"id":"s03","t":15.9,"in":"cut","who":[],"fx":["dust"],"flicker":0.3,"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"An old painted map of the island of Alaron on a desk by candlelight, a gloved finger on a harbour town beside a lake, no readable text"},{"id":"s04","t":24.22,"in":"cut","who":["lucien","arth __cw.boards["08-baphomet"] = {"id":"baphomet","live":true,"cover":"s21","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","neeris":"Neeris, a wiry forest druid in his forties who carries a wolf curse: moss-green hooded ranger cloak over worn leather, a gnarled wooden staff, gaunt weathered face, unkempt dark hair and short beard, amber eyes, a haunted desperate look","baphomet":"Baphomet, a goat-headed demon imprisoned deep beneath a moonlit lake, only ever seen as an enormous face beneath its black water, never rising out of it: long curved black horns, matted dark fur, cracked skin glowing like embers, burning yellow eyes","wyrm":"the black wyrm, a huge black dragon: lean serpentine body, tattered black wings, ridged horns along the skull, glowing orange throat and eyes, smoke from its nostrils","wraith":"the wraith, a colossal hooded spectre: tattered grey-black robes, no face but cold blue light inside the hood, long skeletal hands, trailing cold mist"},"shots":[{"id":"s01","t":0,"in":"black","who":["lucien"],"fx":["embers","smoke"],"flicker":0.5,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"Close-up of Lucien Vale's hands tuning his lute beside a tavern fireplace, the rest of the room in darkness, a quiet moment before the story"},{"id":"s02","t":10.35,"in":"fade","who":["lucien","arthas","cedric","neeris"],"fx":["fog"],"flicker":0.3,"move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"The three half-brothers and Neeris the druid leaving a town at night along a lantern-lit lane, seen from behind, walking toward a dark forest"},{"id":"s03","t":21.6,"in":"ink","who":["lucien","arthas","cedric","neeris"],"fx":["fog","fireflies"],"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"A narrow forest path under a full moon, seen from behind: Lucien Vale, Arthas the paladin, Cedric the monk and Neeris the druid, tall men of normal human height, walking away from the viewer in single file between huge dark trees, moonlight falling in shafts through the mist"},{"id":"s04","t":33,"in":"fade","who":[],"fx":["fog"],"grade":"cold","move":{"from":[0.05,0.02,0.02],"to":[-0.04,0,0.12]},"scene":"A moon lake in a forest clearing at night: a still round lake glowing cold blue, tall standing stones around its shore, six heavy iron chains running from the stones down into the water, mist drifting on the surface"},{"id":"s05","t":41.9,"in":"cut","who":["arthas","lucien","cedric"],"fx":["fog"],"move":{"from":[0,0.04,0.02],"to":[0,0,0.18]},"scene":"Arthas the paladin kneeling at the edge of the glowing blue moon lake, one gauntlet off, a knife at his open palm, his two brothers watching behind him on the shore"},{"id":"s06","t":48.21,"in":"cut","who":[],"fx":["dust"],"move":{"from":[0.03,0,0.08],"to":[-0.03,0,0.16]},"scene":"Extreme close-up: drops of blood falling from a hand into the glowing blue water of a moonlit lake, the blue turning red where they land, ripples spreading"},{"id":"s07","t":54.08,"in":"flash","who":[],"fx":["sparks","smoke"],"shake":0.4,"grade":"red","move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"One of the six iron chains that run from the standing stones into the moon lake snapping, a single link bursting apart in a shower of sparks, the lake turning black as ink with red light seeping up from deep below, the other chains straining but holding"},{"id":"s08","t":56.48,"in":"cut","who":["baphomet"],"fx":["embers","smoke"],"grade":"red","move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"The moon lake gone black as ink, and just beneath the surface the enormous face of a goat-headed demon, long curved horns and burning yellow eyes, rippling, looking up from very deep below; nothing comes out of the water"},{"id":"s09","t":59.12,"in":"cut","who":["baphomet"],"fx":["smoke"],"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"Looking straight down onto the ink-black surface of the lake: deep beneath it, wholly under __cw.boards["10-ahm-dynasty"] = {"id":"ahm-dynasty","live":true,"cover":"s22","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","wizard":"a Scarlet Wizard: a gaunt sorcerer with a shaved head covered in red arcane tattoos, layered blood-red robes with gold trim, cold eyes, fire or mist curling from his hands","mara":"Mara, Lucien's only real friend: a strong, curvy, attractive barkeep in her thirties, broad shoulders and strong arms, thick auburn hair tied back, freckles, warm confident eyes, rolled-up linen sleeves, a leather apron and laced bodice, a tavern woman who can throw a drunk out by herself","mother":"the brothers' mother: a tall, noble, beautiful lady in her fifties, graceful and upright, long silver-streaked dark hair braided with gold, fine high-cheekboned face, deep green travelling gown and a fur-lined grey cloak, a dignified bearing, warm but sorrowful eyes; here she wears a dark scarlet hooded cloak over her gown, a spy inside the Scarlet Wizards","valerys":"High Inquisitor Valerys, the stern father of Arthas and Cedric: a tall man in his sixties, close-cropped grey hair and a short grey beard, hard pale grey eyes, white and crimson inquisitor robes with a gold sun emblem on the chest, a heavy gold chain of office, a calm unreadable face","assassin":"a Scarlet assassin: a lean woman in close-fitting dark red leather with a hood and a half mask over her mouth, cold pale eyes, short black hair, a recurve bow and a quiver, knives at her belt","guard":"guards of the Ahm Dynasty, the merchant house: men in black and gold livery with gold-trimmed half-capes, steel breastplates, short swords and crossbows, a golden crest of a winged lion on the chest"},"shots":[{"id":"s01","t":0,"in":"black","who":[],"fx":["fog"],"flicker":0.3,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"A harbour town at night, a lantern-lit tavern with a warm window on a wet cobbled stree __cw.boards["11-hunger-grows"] = {"id":"hunger-grows","live":true,"cover":"s17","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric 'Cold-Eye', a human monk: shaved head, short dark beard, hard pale grey eyes, red and brown leather monk wraps over a green tunic, one bronze dragon-shaped shoulder pauldron, prayer beads, a long wooden staff, wiry strong build","wizard":"a Scarlet Wizard: a gaunt sorcerer with a shaved head covered in red arcane tattoos, layered blood-red robes with gold trim, cold eyes, fire or mist curling from his hands","duncastle":"Duncastle, the Church's fortress between the forest and the plains: grey stone curtain walls with crenellations, square towers with ballistae on top, a tall timber-framed tower with a red tiled roof in the courtyard, wooden palisades, stables with a red roof","severin":"Severin, a tall pale woman of the forest: very long straight silver-white hair, dark moss-green hooded ranger cloak, faint mint-green glowing eyes, calm unreadable face, a soft green light around her","valerys":"High Inquisitor Valerys, the stern father of Arthas and Cedric: a tall man in his sixties, close-cropped grey hair and a short grey beard, hard pale grey eyes, white and crimson inquisitor robes with a gold sun emblem on the chest, a heavy gold chain of office, a calm unreadable face","baphomet":"Baphomet, a goat-headed demon imprisoned deep beneath a moonlit lake, only ever seen as an enormous face beneath its black water, never rising out of it: long curved black horns, matted dark fur, cracked skin glowing like embers, burning yellow eyes","silas":"Silas, a lean human dock smuggler in his thirties: buzzed dark hair, stubble, sunken nervous eyes, drab grey-olive patched coat, rope belt, ink-stained fingers","wolfsilas":"Silas the werewolf, exactly as in the reference painting but further gone, more wolf than man: the lean dock smuggler with a full wolf snout and fangs, coarse dark brown fur over his face, arms and back, wild glowing yellow eyes, pointed ears, clawed hands, hunched, his drab grey-olive patched coat and rope belt torn to rags; frightening, not comical","imp":"an imp: a nasty little fiend the size of a dog, dark red leathery skin, small torn bat wings, short horns, a barbed tail, long claws, needle teeth, and a fat swollen belly that glows from inside with orange fire through cracks in the skin, about to burst; menacing and grotesque, not cute, no clothes"},"shots":[{"id":"s01","t":0,"in":"black","who":[],"fx":["dust"],"flicker":0.4,"move":{"from":[0,0,0.04],"to":[0,0,0.2]},"scene":"An empty narrow worn stone stair spiralling down into total darkness, a single torch flame far below, no people at all"},{"id":"s02","t":8.4,"in":"fade","who":["lucien","arthas","cedric"],"fx":["dust","fog"],"flicker":0.5,"move":{"from":[-0.04,0,0.05],"to":[0.04,0,0.12]},"scene":"The three brothers descending the narrow stone stair in single file, Arthas first with a torch, Lucien Vale (long blond hair, pointed ears, burgundy coat) in the middle, Cedric last, seen from below, deep shadow"},{"id":"s03","t":17.04,"in":"cut","who":["lucien"],"fx":["dust"],"flicker":0.4,"move":{"from":[0,0,0.22],"to":[0,0,0.05]},"scene":"in the stone cellars deep below the Ahm safehouse, a cramped study, Lucien Vale (long blond hair, pointed ears, burgundy coat) holding up a report with a charcoal sketch of his own face on it, by candlelight, his face hardening (no readable text)"},{"id":"s04","t":21.94,"in":"cut","who":[],"fx":["dust"],"flicker":0.4,"move":{"from":[0.05,0.02,0.02],"to":[-0.04,0,0.12]},"scene":"in the stone cellars deep below the Ahm safehouse, an empty room: a heavy door sealed with chains and wax seals, beside it a desk covered in ledgers and letters, names written in ink, candlelight, no people at all"},{"id":"s05","t":26.99,"in":"cut","who":[],"fx":["dust"],"flicker":0.3,"move":{"from":[0,0.04,0.02],"to":[0,0,0.18]},"scene":"Tight close-up of two wax seals pressed side by side on one letter: a golden dynasty crest and a blood-red open hand, candlelight, no readable text"},{"id":"s06","t":32.06,"in":"cut","who":["arthas","cedric","lucien"],"fx":["d __cw.boards["12-fall-duncastle"] = {"id":"fall-duncastle","live":true,"cover":"s21","style":"Stylized heroic fantasy painting in the look of a hand-painted 2D animated fantasy cinematic short: bold simplified shapes, slightly heroic sturdy proportions (broad shoulders, solid armour and props), heavy confident painterly brush strokes, hand-painted textures, rich saturated colour with a limited palette per scene, strong warm rim light against deep cool shadows, big areas of calm empty darkness, atmospheric haze between clear foreground, middle ground and background layers, cinematic widescreen composition. No ink outlines and no comic line art: edges are defined only by paint and light. Grounded anatomy and believable faces with real weight and emotion, semi-realistic like a painted cinematic short, not a cartoon, not a comic, not photorealistic, not a book illustration. Full-bleed image edge to edge: no black bars, no letterbox, no text, no letters, no logos, no borders, no frame, no watermark.","cast":{"lucien":"Lucien Vale, a young half-elf wild magic sorcerer who loves to sing and play music, a good-hearted man who was betrayed: long straight blond hair, pointed elf ears, clean-shaven handsome face with fine elven features and a straight, slim, normal-sized nose, lively expressive eyes, burgundy velvet long coat with brass buttons over a dark shirt, leather belt with a dagger whose blade glows faintly blue, faint purple arcane sparks flickering at his fingertips, a lute on his back, slim build. His face is full of life and follows the scene: shouting, laughing, fierce, cocky, scheming, grieving only when the scene grieves. Sympathetic hero, never sinister or villainous","arthas":"Arthas, a tall devout human paladin: full dark steel plate armour, a dark cloth hood always worn up over a closed steel helm (hood visible in every view), two burning orange eye slits, broad shoulders, heavy bronze-hilted longsword, a faded holy sun emblem on his chest","cedric":"Cedric '   $('bClose').textContent = ride ? (fromList ? (innerWidth < 560 ? 'Songs' : 'Back to the songs') : innerWidth < 560 ? 'Book' : 'Back to the book') : 'Stand up';

  if (walk) { $('hint').textContent = W.nearChair ? HINT_NEAR : HINT_FAR; }

  if (sitting) $('hint').textContent = '';

/* ---------- lyrics ---------- */
const cueAt = (t) => { let k = 0; story.cues.forEach((c, i) => { if (c.t <= t) k = i; }); return k; };

}
